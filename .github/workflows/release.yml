# Release: built from a version tag (vX.Y.Z or vX.Y.ZrcN) or started by hand.
#
# Pre-releases (rc) go to TestPyPI and a GitHub pre-release.  Final tags go to
# PyPI, which only runs after a reviewer approves the `pypi` environment.
# Publishing uses PyPI trusted publishing: no API tokens are stored in the repo.
# Third-party actions are pinned by commit SHA.  See docs/operations/release-process.md.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [testpypi]
        default: testpypi

permissions:
  contents: read

env:
  IMAGE_OWNER: ghcr.io/emberphantom

jobs:
  checks:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint and format
        run: |
          ruff check skill_sentry_cli tests scripts
          ruff format --check skill_sentry_cli tests scripts
      - name: Tests
        run: pytest tests -q

  build:
    name: Build artifacts
    needs: [checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Version matches the tag
        id: version
        run: |
          python - <<'PY'
          import os, re, sys
          text = open("skill_sentry_cli/core/version.py", encoding="utf-8").read()
          version = re.search(r'__version__ = "([^"]+)"', text).group(1)
          ref = os.environ.get("GITHUB_REF_NAME", "")
          if ref.startswith("v") and ref[1:] != version:
              sys.exit(f"tag {ref} does not match version {version}")
          prerelease = "rc" in version
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\nprerelease={'true' if prerelease else 'false'}\n")
          print("version", version, "prerelease", prerelease)
          PY

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Build the dashboard
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the sandbox image (multi-architecture)
        id: sandbox
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: skill_sentry_cli/core/sandbox/assets
          file: skill_sentry_cli/core/sandbox/assets/Dockerfile.sandbox
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ env.IMAGE_OWNER }}/skillsentry-sandbox:${{ steps.version.outputs.version }}

      - name: Record the sandbox digest in the package
        run: |
          python - "${{ steps.sandbox.outputs.digest }}" <<'PY'
          import json, sys
          path = "skill_sentry_cli/data/sandbox_image.json"
          record = {"repository": "ghcr.io/emberphantom/skillsentry-sandbox", "digest": sys.argv[1]}
          if not record["digest"].startswith("sha256:"):
              sys.exit("no digest returned by the sandbox build")
          json.dump(record, open(path, "w", encoding="utf-8"), indent=2)
          open(path, "a", encoding="utf-8").write("\n")
          PY

      - name: Build and push the server image (multi-architecture)
        id: server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ env.IMAGE_OWNER }}/skill-sentry-server:${{ steps.version.outputs.version }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign both images by digest (keyless, through this workflow's OIDC identity)
        env:
          SANDBOX_IMAGE: ${{ env.IMAGE_OWNER }}/skillsentry-sandbox@${{ steps.sandbox.outputs.digest }}
          SERVER_IMAGE: ${{ env.IMAGE_OWNER }}/skill-sentry-server@${{ steps.server.outputs.digest }}
        run: |
          cosign sign --yes "$SANDBOX_IMAGE"
          cosign sign --yes "$SERVER_IMAGE"

      - name: Build the wheel and sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist --wheel --outdir dist .
          python scripts/check_wheel.py dist/*.whl
          python -m twine check dist/*

      - name: Installer and checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Kept out of dist/: the publish action uploads every file there to the index.
          mkdir -p release
          # The attached installer must fetch this release, not the one it was copied from.
          sed -E "s/^VERSION=\"[^\"]*\"/VERSION=\"${VERSION}\"/" install.sh > release/install.sh
          chmod +x release/install.sh
          grep -q "^VERSION=\"${VERSION}\"" release/install.sh
          sed -E 's/\[string\]\$Version = "[^"]*"/[string]$Version = "'"${VERSION}"'"/' install.ps1 > release/install.ps1
          grep -qF "[string]\$Version = \"${VERSION}\"" release/install.ps1
          (cd dist && sha256sum *.whl *.tar.gz) > release/SHA256SUMS

          # CycloneDX SBOM of exactly what the wheel installs. It is built in clean
          # virtual environments so the tool itself is not listed as a dependency.
          python -m venv "$RUNNER_TEMP/sbom-install"
          "$RUNNER_TEMP/sbom-install/bin/pip" install --quiet dist/*.whl
          python -m venv "$RUNNER_TEMP/sbom-tool"
          "$RUNNER_TEMP/sbom-tool/bin/pip" install --quiet "cyclonedx-bom==7.6.0"
          "$RUNNER_TEMP/sbom-tool/bin/cyclonedx-py" environment --of JSON \
            -o release/sbom.cdx.json "$RUNNER_TEMP/sbom-install/bin/python"
          (cd release && sha256sum sbom.cdx.json) >> release/SHA256SUMS
          cat release/SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: release/

      - name: Build provenance (public repositories only)
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build]
    if: needs.build.outputs.prerelease == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/skill-sentry-cli
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-pypi:
    name: Publish to PyPI (approval required)
    needs: [build]
    if: needs.build.outputs.prerelease == 'false' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/skill-sentry-cli
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/

  github-release:
    name: GitHub release
    needs: [build, publish-testpypi, publish-pypi]
    if: github.event_name == 'push' && always() && needs.build.result == 'success' && (needs.publish-testpypi.result == 'success' || needs.publish-pypi.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
          path: release/
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            release/install.sh
            release/install.ps1
            release/SHA256SUMS
            release/sbom.cdx.json
